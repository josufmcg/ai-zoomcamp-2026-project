[project]
name = "efinges-backend"
version = "0.1.0"
description = "FastAPI backend for EFINGES, a residential property management platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-exporter-otlp>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3.0",
    "pytest>=8.0,<9.0",
    "pyyaml>=6.0,<7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Unit tests only by default. The end-to-end integration workflows live in
# tests/integration/ and are excluded here so `uv run pytest` stays a fast,
# dependency-free unit run; run them explicitly with `uv run pytest
# tests/integration` (backlog task 18).
testpaths = ["tests"]
norecursedirs = ["integration"]
markers = [
    "integration: end-to-end workflow against a dedicated database (backlog task 18)",
]
