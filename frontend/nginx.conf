# nginx configuration for the EFINGES frontend image (backlog task 3).
#
# Serves the Vite production bundle on port 3000 and falls back to
# `index.html` so client-side routes resolve on a hard refresh.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
