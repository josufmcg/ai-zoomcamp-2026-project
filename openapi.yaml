  /units:
    get:
      description: 'List units visible to the caller, with optional filters.


        A resident only ever sees their own units; a manager sees the units in the

        communities they manage; an administrator sees every unit.


        Every filter is written as a correlated ``EXISTS`` (``.has()`` / ``.any()``)

        rather than a join, so combining the scope rule with the ``community_id``

        filter cannot join ``buildings`` twice.'
      operationId: list_units_units_get
      parameters:
      - in: query
        name: building_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Building Id
      - in: query
        name: community_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Community Id
      - in: query
        name: tag_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tag Id
