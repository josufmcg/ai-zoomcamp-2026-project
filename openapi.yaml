components:
  schemas:
    AssignmentCreate:
      description: Request body for assigning a resident to a unit.
      properties:
        ownership_type:
          $ref: '#/components/schemas/OwnershipType'
        unit_id:
          title: Unit Id
          type: integer
        user_id:
          title: User Id
          type: integer
      required:
      - user_id
      - unit_id
      - ownership_type
      title: AssignmentCreate
      type: object
    AssignmentRead:
      description: 'Public representation of a unit assignment.


        The embedded user and unit objects let manager screens render a table

        without a second request, and they never contain the password hash.'
      properties:
        id:
          title: Id
          type: integer
        ownership_type:
          $ref: '#/components/schemas/OwnershipType'
        unit:
          $ref: '#/components/schemas/UnitRead'
        unit_id:
          title: Unit Id
          type: integer
        user:
          $ref: '#/components/schemas/UserRead'
        user_id:
          title: User Id
          type: integer
      required:
      - id
      - user_id
      - unit_id
      - ownership_type
      - user
      - unit
      title: AssignmentRead
      type: object
    BillCreate:
      description: 'Request body for ``POST /bills`` (manager for the unit''s community).


        ``amount`` is a :class:`~decimal.Decimal` with at most two decimal places

        and a positive value, so money never travels as binary floating point.

        ``issue_date`` defaults to today when the manager omits it.'
      properties:
        amount:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: string
          title: Amount
        description:
          maxLength: 500
          minLength: 1
          title: Description
          type: string
        due_date:
          format: date
          title: Due Date
          type: string
        issue_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Issue Date
        unit_id:
          title: Unit Id
          type: integer
      required:
      - unit_id
      - amount
      - description
      - due_date
      title: BillCreate
      type: object
    BillDisplayStatus:
      description: 'The status a client sees: the stored status or ``overdue``.'
      enum:
      - pending
      - paid
      - overdue
      title: BillDisplayStatus
      type: string
    BillRead:
      description: Public representation of a bill, with the computed display status.
      properties:
        amount:
          title: Amount
          type: string
        description:
          title: Description
          type: string
        due_date:
          format: date
          title: Due Date
          type: string
        id:
          title: Id
          type: integer
        issue_date:
          format: date
          title: Issue Date
          type: string
        status:
          $ref: '#/components/schemas/BillDisplayStatus'
        unit_id:
          title: Unit Id
          type: integer
        unit_identifier:
          title: Unit Identifier
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
      required:
      - id
      - unit_id
      - unit_identifier
      - unit_type
      - amount
      - description
      - issue_date
      - due_date
      - status
      title: BillRead
      type: object
    Body_login_auth_token_post:
      properties:
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
        grant_type:
          anyOf:
          - pattern: ^password$
            type: string
          - type: 'null'
          title: Grant Type
        password:
          format: password
          title: Password
          type: string
        scope:
          default: ''
          title: Scope
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - password
      title: Body_login_auth_token_post
      type: object
    BuildingCreate:
      description: 'Request body for ``POST /buildings`` (administrators only).


        A building belongs to a fixed community, so ``community_id`` is required

        and immutable; moving a building means deleting and recreating it.'
      properties:
        community_id:
          title: Community Id
          type: integer
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
        tag_ids:
          items:
            type: integer
          title: Tag Ids
          type: array
      required:
      - community_id
      - name
      title: BuildingCreate
      type: object
    BuildingRead:
      description: Public representation of a building, with its tags.
      properties:
        community_id:
          title: Community Id
          type: integer
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        tags:
          items:
            $ref: '#/components/schemas/TagRead'
          title: Tags
          type: array
      required:
      - id
      - community_id
      - name
      title: BuildingRead
      type: object
    BuildingUpdate:
      description: Request body for ``PATCH /buildings/{id}`` (manager for its community).
      properties:
        name:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        tag_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Tag Ids
      title: BuildingUpdate
      type: object
    CommentCreate:
      description: Request body for ``POST /incidences/{id}/comments``.
      properties:
        body:
          maxLength: 4000
          minLength: 1
          title: Body
          type: string
      required:
      - body
      title: CommentCreate
      type: object
    CommentRead:
      description: Public representation of one comment in a thread.
      properties:
        author_email:
          title: Author Email
          type: string
        author_id:
          title: Author Id
          type: integer
        body:
          title: Body
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: integer
        incidence_id:
          title: Incidence Id
          type: integer
      required:
      - id
      - incidence_id
      - author_id
      - author_email
      - body
      - created_at
      title: CommentRead
      type: object
    CommunityCreate:
      description: Request body for ``POST /communities`` (administrators only).
      properties:
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: CommunityCreate
      type: object
    CommunityRead:
      description: Public representation of a community.
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
      required:
      - id
      - name
      title: CommunityRead
      type: object
    CommunityUpdate:
      description: Request body for ``PATCH /communities/{id}`` (administrators only).
      properties:
        name:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Name
      title: CommunityUpdate
      type: object
    EligibleUnitRead:
      description: 'One of the caller''s units that may vote in an initiative.


        ``option_id`` is ``None`` (with ``vote_id`` ``None``) until the unit votes,

        so the resident form can render both "cast a ballot here" and "you chose

        X" from a single list.'
      properties:
        option_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Option Id
        unit_id:
          title: Unit Id
          type: integer
        unit_identifier:
          title: Unit Identifier
          type: string
        unit_type:
          $ref: '#/components/schemas/UnitType'
        vote_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Vote Id
      required:
      - unit_id
      - unit_identifier
      - unit_type
      title: EligibleUnitRead
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IncidenceCreate:
      description: 'Request body for ``POST /incidences`` (residents only).


        The unit must be one of the caller''s own units, so only ``unit_id`` is

        needed; the reporter is the signed-in user.'
      properties:
        description:
          maxLength: 4000
          minLength: 1
          title: Description
          type: string
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        unit_id:
          title: Unit Id
          type: integer
      required:
      - unit_id
      - title
      - description
      title: IncidenceCreate
      type: object
    IncidenceRead:
      description: 'Public representation of an incidence.


        ``comments`` is included so a detail response carries the whole thread;

        the list endpoint returns the same shape with the comment list populated,

        which keeps the frontend on one type.'
      properties:
        comments:
          items:
            $ref: '#/components/schemas/CommentRead'
          title: Comments
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        created_by_email:
          title: Created By Email
          type: string
        created_by_id:
          title: Created By Id
          type: integer
        description:
          title: Description
          type: string
        id:
          title: Id
          type: integer
        status:
          $ref: '#/components/schemas/IncidenceStatus'
        title:
          title: Title
          type: string
        unit_id:
          title: Unit Id
          type: integer
        unit_identifier:
          title: Unit Identifier
          type: string
      required:
      - id
      - unit_id
      - unit_identifier
      - created_by_id
      - created_by_email
      - title
      - description
      - status
      - created_at
      title: IncidenceRead
      type: object
    IncidenceStatus:
      description: The four stages of an incidence, in lifecycle order.
      enum:
      - submitted
      - in progress
      - resolved
      - closed
      title: IncidenceStatus
      type: string
    IncidenceStatusUpdate:
      description: Request body for ``PATCH /incidences/{id}/status`` (managers only).
      properties:
        status:
          $ref: '#/components/schemas/IncidenceStatus'
      required:
      - status
      title: IncidenceStatusUpdate
      type: object
    InitiativeCreate:
      description: 'Request body for ``POST /initiatives`` (managers only).


        ``closes_at`` must not precede ``opens_at`` and there must be at least two

        distinct options, both enforced by the validator below so an invalid

        initiative can never be stored.'
      properties:
        closes_at:
          format: date
          title: Closes At
          type: string
        description:
          maxLength: 4000
          minLength: 1
          title: Description
          type: string
        opens_at:
          format: date
          title: Opens At
          type: string
        options:
          items:
            $ref: '#/components/schemas/InitiativeOptionCreate'
          minItems: 2
          title: Options
          type: array
        scope:
          $ref: '#/components/schemas/InitiativeScope'
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - title
      - description
      - opens_at
      - closes_at
      - options
      title: InitiativeCreate
      type: object
    InitiativeOptionCreate:
      description: One choice in the initiative request body.
      properties:
        label:
          maxLength: 200
          minLength: 1
          title: Label
          type: string
      required:
      - label
      title: InitiativeOptionCreate
      type: object
    InitiativeOptionRead:
      description: Public representation of one choice, with its running ballot count.
      properties:
        id:
          title: Id
          type: integer
        label:
          title: Label
          type: string
        position:
          title: Position
          type: integer
        votes:
          default: 0
          title: Votes
          type: integer
      required:
      - id
      - label
      - position
      title: InitiativeOptionRead
      type: object
    InitiativeRead:
      description: 'Public representation of an initiative, with options and ballot counts.


        ``is_open`` is computed against the request''s "today" so the frontend can

        disable the voting form without duplicating the date rule; ``scope`` is

        echoed back so the manager screens can render the eligibility filter.'
      properties:
        closes_at:
          format: date
          title: Closes At
          type: string
        created_by_id:
          title: Created By Id
          type: integer
        description:
          title: Description
          type: string
        id:
          title: Id
          type: integer
        is_open:
          title: Is Open
          type: boolean
        opens_at:
          format: date
          title: Opens At
          type: string
        options:
          items:
            $ref: '#/components/schemas/InitiativeOptionRead'
          title: Options
          type: array
        scope:
          $ref: '#/components/schemas/InitiativeScope'
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - description
      - opens_at
      - closes_at
      - is_open
      - scope
      - created_by_id
      title: InitiativeRead
      type: object
    InitiativeScope:
      description: 'Eligibility filter over communities, buildings, unit types, and tags.


        All keys are optional and combine with AND: a unit is eligible when it

        matches every filter that is present.'
      properties:
        building_ids:
          items:
            type: integer
          title: Building Ids
          type: array
        community_ids:
          items:
            type: integer
          title: Community Ids
          type: array
        tag_ids:
          items:
            type: integer
          title: Tag Ids
          type: array
        unit_types:
          items:
            $ref: '#/components/schemas/UnitType'
          title: Unit Types
          type: array
      title: InitiativeScope
      type: object
    ManagerAssignmentCreate:
      description: Request body for assigning a manager to a community (administrators only).
      properties:
        community_id:
          title: Community Id
          type: integer
        manager_id:
          title: Manager Id
          type: integer
      required:
      - manager_id
      - community_id
      title: ManagerAssignmentCreate
      type: object
    ManagerAssignmentRead:
      description: Public representation of a manager-to-community assignment.
      properties:
        community:
          $ref: '#/components/schemas/CommunityRead'
        community_id:
          title: Community Id
          type: integer
        id:
          title: Id
          type: integer
        manager:
          $ref: '#/components/schemas/UserRead'
        manager_id:
          title: Manager Id
          type: integer
      required:
      - id
      - manager_id
      - community_id
      - manager
      - community
      title: ManagerAssignmentRead
      type: object
    MyUnitRead:
      description: 'A unit belonging to the signed-in resident, with the ownership flag.


        Built from a :class:`app.models.UnitAssignment` so the resident can tell

        which units they own from the ones they rent.'
      properties:
        building_id:
          title: Building Id
          type: integer
        id:
          title: Id
          type: integer
        identifier:
          title: Identifier
          type: string
        ownership_type:
          $ref: '#/components/schemas/OwnershipType'
        tags:
          items:
            $ref: '#/components/schemas/TagRead'
          title: Tags
          type: array
        unit_type:
          $ref: '#/components/schemas/UnitType'
      required:
      - id
      - building_id
      - identifier
      - unit_type
      - ownership_type
      title: MyUnitRead
      type: object
    OwnershipType:
      description: 'How a resident holds a unit (backlog task 7).


        ``OWNER`` covers outright ownership; ``TENANT`` covers a rental or other

        occupancy agreement. Both are billed and voted on the same way, so the flag

        only records the legal relationship to the unit.'
      enum:
      - owner
      - tenant
      title: OwnershipType
      type: string
    TagCreate:
      description: Request body for creating a tag (managers and administrators).
      properties:
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: TagCreate
      type: object
    TagRead:
      description: A free-text label attached to a building or a unit.
      properties:
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
      required:
      - id
      - name
      title: TagRead
      type: object
    Token:
      description: Response body for a successful ``POST /auth/token`` login.
      properties:
        access_token:
          title: Access Token
          type: string
        token_type:
          default: bearer
          title: Token Type
          type: string
      required:
      - access_token
      title: Token
      type: object
    UnitCreate:
      description: Request body for ``POST /units`` (manager for the building's community).
      properties:
        building_id:
          title: Building Id
          type: integer
        identifier:
          maxLength: 100
          minLength: 1
          title: Identifier
          type: string
        tag_ids:
          items:
            type: integer
          title: Tag Ids
          type: array
        unit_type:
          $ref: '#/components/schemas/UnitType'
      required:
      - building_id
      - identifier
      - unit_type
      title: UnitCreate
      type: object
    UnitRead:
      description: 'Public representation of a unit, with its tags.


        The parent building id is included so the frontend can group units without

        extra requests.'
      properties:
        building_id:
          title: Building Id
          type: integer
        id:
          title: Id
          type: integer
        identifier:
          title: Identifier
          type: string
        tags:
          items:
            $ref: '#/components/schemas/TagRead'
          title: Tags
          type: array
        unit_type:
          $ref: '#/components/schemas/UnitType'
      required:
      - id
      - building_id
      - identifier
      - unit_type
      title: UnitRead
      type: object
    UnitType:
      description: The kinds of unit a building can contain.
      enum:
      - apartment
      - garage
      - storage
      title: UnitType
      type: string
    UnitUpdate:
      description: Request body for ``PATCH /units/{id}``.
      properties:
        identifier:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          title: Identifier
        tag_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Tag Ids
        unit_type:
          anyOf:
          - $ref: '#/components/schemas/UnitType'
          - type: 'null'
      title: UnitUpdate
      type: object
    UserCreate:
      description: 'Request body for ``POST /users`` (administrator only).


        Validation is intentionally narrow: a non-empty email, a password of at

        least eight characters, and one of the three roles. The concrete email

        format is the administrator''s responsibility because the platform is

        deployed inside a firm that seeds accounts from its own directory.'
      properties:
        email:
          maxLength: 320
          minLength: 3
          title: Email
          type: string
        password:
          maxLength: 128
          minLength: 8
          title: Password
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
          default: resident
      required:
      - email
      - password
      title: UserCreate
      type: object
    UserRead:
      description: 'Public representation of a user. Never exposes the password hash.


        ``email`` is a plain string: the database stores emails without a format

        constraint, so the response schema must serialize stored data faithfully

        rather than fail on addresses that use reserved domains such as ``.test``.'
      properties:
        email:
          title: Email
          type: string
        id:
          title: Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        role:
          $ref: '#/components/schemas/UserRole'
      required:
      - id
      - email
      - role
      - is_active
      title: UserRead
      type: object
    UserRole:
      description: The three roles a user can hold (backlog task 6).
      enum:
      - administrator
      - manager
      - resident
      title: UserRole
      type: string
    UserUpdate:
      description: 'Request body for ``PATCH /users/{id}`` (administrator only).


        Every field is optional so a patch can change only the role, only the

        activation flag, or only the password. ``None`` means "leave unchanged".'
      properties:
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        password:
          anyOf:
          - maxLength: 128
            minLength: 8
            type: string
          - type: 'null'
          title: Password
        role:
          anyOf:
          - $ref: '#/components/schemas/UserRole'
          - type: 'null'
      title: UserUpdate
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VoteCast:
      description: 'Request body for ``POST /initiatives/{id}/votes`` (residents only).


        One ballot covers one of the caller''s eligible units, so both the unit and

        the chosen option are required.'
      properties:
        option_id:
          title: Option Id
          type: integer
        unit_id:
          title: Unit Id
          type: integer
      required:
      - unit_id
      - option_id
      title: VoteCast
      type: object
    VoteRead:
      description: Public representation of one cast ballot.
      properties:
        id:
          title: Id
          type: integer
        initiative_id:
          title: Initiative Id
          type: integer
        option_id:
          title: Option Id
          type: integer
        option_label:
          title: Option Label
          type: string
        unit_id:
          title: Unit Id
          type: integer
        unit_identifier:
          title: Unit Identifier
          type: string
      required:
      - id
      - initiative_id
      - option_id
      - option_label
      - unit_id
      - unit_identifier
      title: VoteRead
      type: object
    VoteResult:
      description: 'Aggregation response for ``GET /initiatives/{id}/results``.


        ``total_votes`` is the number of eligible unit ballots cast, and

        ``tallies`` reports the count per option in the manager''s ordering.'
      properties:
        initiative_id:
          title: Initiative Id
          type: integer
        tallies:
          items:
            $ref: '#/components/schemas/VoteTally'
          title: Tallies
          type: array
        total_votes:
          title: Total Votes
          type: integer
      required:
      - initiative_id
      - total_votes
      title: VoteResult
      type: object
    VoteTally:
      description: Ballot count for one option in an aggregation response.
      properties:
        label:
          title: Label
          type: string
        option_id:
          title: Option Id
          type: integer
        votes:
          title: Votes
          type: integer
      required:
      - option_id
      - label
      - votes
      title: VoteTally
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/token
      type: oauth2
info:
  title: EFINGES API
  version: 0.1.0
openapi: 3.1.0
paths:
  /assignments:
    get:
      description: List assignments, optionally filtered by resident or unit.
      operationId: list_assignments_assignments_get
      parameters:
      - in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: User Id
      - in: query
        name: unit_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Unit Id
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AssignmentRead'
                title: Response List Assignments Assignments Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Assignments
      tags:
      - assignments
    post:
      description: 'Assign one resident to one unit.


        Returns 404 when the user or unit does not exist, 409 when the unit is

        already assigned, and 422 when the target user is not a resident.'
      operationId: create_assignment_assignments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentRead'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Assignment
      tags:
      - assignments
  /assignments/{assignment_id}:
    delete:
      description: Remove an assignment (the resident loses access to that unit).
      operationId: delete_assignment_assignments__assignment_id__delete
      parameters:
      - in: path
        name: assignment_id
        required: true
        schema:
          title: Assignment Id
          type: integer
