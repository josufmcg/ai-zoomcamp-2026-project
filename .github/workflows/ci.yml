# EFINGES continuous integration (backlog tasks 19 and 21).
#
# Runs on every push and every pull request. Four jobs:
#
#   backend   - install backend dependencies with uv, lint with Ruff, run the
#               unit suite against in-memory SQLite, then run the end-to-end
#               integration workflows against a real PostgreSQL service.
#   frontend  - install frontend dependencies, lint with ESLint, run Vitest,
#               then produce the production build (which also type-checks).
#   docker    - once both of the above pass, build both Docker images to prove
#               the images still build from the committed Dockerfiles.
#   deploy    - once backend and frontend pass, bring the whole stack up with
#               `docker compose up --wait`, seed the demo data, and read it
#               back through the live HTTP API. Cloud deployment is out of
#               scope, so this is the project's deployment step: it proves the
#               system the reviewer runs from the README actually works.
#
# Dependencies are cached (uv's cache and npm's cache, plus the Docker layer
# cache) so the total runtime stays reasonable.

name: CI

on:
  # Every push, on any branch, and every pull request.
  push:
  pull_request:

# A newer run for the same ref makes an in-flight one pointless; cancel it so
# the queue stays short and results arrive sooner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository, so grant the least privilege.
permissions:
  contents: read

env:
  # Silences uv's progress output so the logs stay readable.
  UV_NO_PROGRESS: "1"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    # The integration workflows (backlog task 18) need a real PostgreSQL to
    # prove the routes, the scoping rules, and the migrations against it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: efinges
          POSTGRES_PASSWORD: efinges
          POSTGRES_DB: efinges_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U efinges -d efinges_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Install uv and the interpreter the lockfile resolves against. The
      # cache key follows backend/uv.lock, so it is reused until the
      # dependencies change.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Lint (Ruff check)
        working-directory: backend
        run: uv run ruff check .

      - name: Check formatting (Ruff format)
        working-directory: backend
        run: uv run ruff format --check .

      # The unit suite re-exports openapi.yaml in a test, so a forgotten
      # re-export after an API change fails here. It also asserts the in-memory
      # SQLite default of TEST_DATABASE_URL and relies on SQLite enum/CHECK
      # behaviour, so it must NOT see the PostgreSQL URL. That variable is
      # scoped to the integration step below instead of the whole job.
      - name: Run unit tests
        working-directory: backend
        run: uv run pytest

      - name: Run integration workflows
        working-directory: backend
        # Point the integration suite at the PostgreSQL service container above.
        # The suite wipes the application tables between tests, which is safe
        # here because this database exists only for the job.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://efinges:efinges@127.0.0.1:5432/efinges_test
        run: uv run pytest tests/integration

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Run tests (Vitest)
        working-directory: frontend
        run: npm test

      # `npm run build` runs `tsc --noEmit` first, so this checks the types too.
      - name: Build for production
        working-directory: frontend
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest

    # Only reached when the backend and frontend checks are green.
    needs: [backend, frontend]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          # Nothing is pushed: the job only proves the image builds.
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          # The backend URL is baked into the bundle at build time; any value
          # builds, so use the documented default.
          build-args: |
            VITE_API_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # Deploy the whole stack exactly as a reviewer would run it locally: one
  # `docker compose up --build`, wait for health, then prove the running system
  # answers. Cloud deployment is out of scope for this project, so "deploy"
  # means "bring the local Compose stack up from the committed images and check
  # the live endpoints". It runs only after every test job passes.
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    needs: [backend, frontend]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Build every service, start it detached, and block until each health
      # check is passing (the compose file defines health checks for postgres,
      # backend, and frontend). `--wait` fails the step if a service does not
      # become healthy, so a broken image or a bad migration fails here.
      - name: Deploy the stack with Docker Compose
        run: docker compose up --build --detach --wait

      # The backend applies `alembic upgrade head` on startup, so a fresh,
      # migrated database must answer its liveness probe.
      - name: Verify the backend is serving
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          echo

      - name: Verify the frontend is serving
        run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/

      # Prove the deployed backend actually talks to its database by seeding and
      # then reading the demo data back through the HTTP API.
      - name: Deploy the demo data and read it back through the API
        run: |
          make seed
          token="$(curl --fail --silent --show-error \
            --request POST http://127.0.0.1:8000/auth/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=manager@efinges.demo' \
            --data-urlencode 'password=efinges-demo-123' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${token}" \
            http://127.0.0.1:8000/bills > /dev/null

      - name: Show the container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear the stack down
        if: always()
        run: docker compose down --volumes
